dimensions:
  firm_id: {label: Firm, description: Top of the organisation hierarchy}
  business_line_id: {label: Business line, description: Business line within the firm}
  desk_id: {label: Desk, description: Trading desk within the business line}
  book_id: {label: Book, description: Trading book within the desk}
  legal_entity: {label: Legal entity, description: Booking legal entity}
  region: {label: Region, description: Booking region}
  asset_class: {label: Asset class, description: Asset class of the position}
  currency: {label: Currency, description: Trade currency}
  risk_class: {label: Risk class, description: Regulatory risk class}
  scenario: {label: Scenario, description: Stress scenario name, or * where a row is not scenario specific}
  counterparty_id: {label: Counterparty, description: Trade counterparty (not in the vector grain)}

hierarchies:
  org: [firm_id, business_line_id, desk_id, book_id]

grain: [firm_id, business_line_id, desk_id, book_id, legal_entity, region, asset_class, currency, risk_class]

measures:
  var_99_1d:
    label: VaR 99% 1-day
    description: Historical-simulation value at risk, 99%, 1-day horizon, current window
    unit: USD
    class: vector
    function: var
    params: {level: 0.99, window: CURRENT, horizon_days: 1}
    table: risk_metrics
  var_99_10d:
    label: VaR 99% 10-day
    description: Historical-simulation value at risk, 99%, 10-day horizon, current window
    unit: USD
    class: vector
    function: var
    params: {level: 0.99, window: CURRENT, horizon_days: 10}
    table: risk_metrics
  es_975_1d:
    label: ES 97.5% 1-day
    description: Expected shortfall, 97.5%, 1-day horizon, current window
    unit: USD
    class: vector
    function: es
    params: {level: 0.975, window: CURRENT, horizon_days: 1}
    table: risk_metrics
  svar_99_1d:
    label: Stressed VaR 99% 1-day
    description: Value at risk, 99%, 1-day horizon, stressed window
    unit: USD
    class: vector
    function: var
    params: {level: 0.99, window: STRESSED, horizon_days: 1}
    table: risk_metrics
  stress_pnl:
    label: Stress P&L
    description: >-
      Sensitivity-based P&L of the book under a stress scenario. Negative is a loss.
      Additive within a scenario; slice by scenario, then sum over anything else.
    unit: USD
    class: additive
    function: sum
    table: stress_results
    dimensions: [firm_id, business_line_id, desk_id, book_id, legal_entity, region, asset_class, currency, risk_class, scenario]
  worst_stress_loss:
    label: Worst stress loss
    description: >-
      Loss under the worst stress scenario of the node, as a positive number (negative if every
      scenario gains). The scenario is in the scenario column of risk_metrics. Not additive:
      only looked up at the nodes where it was computed.
    unit: USD
    class: structured
    carries_scenario: true
    table: risk_metrics
    computed_at:
      - [firm_id]
      - [firm_id, business_line_id]
      - [firm_id, business_line_id, desk_id]
      - [firm_id, business_line_id, desk_id, book_id]
  frtb_sa_charge:
    label: FRTB SA capital charge
    description: >-
      Standardised approach market risk capital: sensitivities-based charge (binding correlation scenario) plus default risk charge plus residual risk add-on. A positive number is capital. Recomputed from the netted
      positions at each node, never a sum of the nodes below: only looked up.
    unit: USD
    class: structured
    table: risk_metrics
    computed_at:
      - [firm_id]
      - [firm_id, business_line_id, desk_id]
  frtb_sbm_charge:
    label: FRTB SBM charge
    description: >-
      Sensitivities-based method charge at the binding correlation scenario (MAR21). A positive number is capital. Recomputed from the netted
      positions at each node, never a sum of the nodes below: only looked up.
    unit: USD
    class: structured
    table: risk_metrics
    computed_at:
      - [firm_id]
      - [firm_id, business_line_id, desk_id]
  frtb_drc_charge:
    label: FRTB default risk charge
    description: >-
      Default risk charge for non-securitisations, summed over buckets (MAR22). A positive number is capital. Recomputed from the netted
      positions at each node, never a sum of the nodes below: only looked up.
    unit: USD
    class: structured
    table: risk_metrics
    computed_at:
      - [firm_id]
      - [firm_id, business_line_id, desk_id]
  frtb_rrao_charge:
    label: FRTB residual risk add-on
    description: >-
      Residual risk add-on on exotic-underlying notional (MAR23). A positive number is capital. Recomputed from the netted
      positions at each node, never a sum of the nodes below: only looked up.
    unit: USD
    class: structured
    table: risk_metrics
    computed_at:
      - [firm_id]
      - [firm_id, business_line_id, desk_id]

  frtb_imcc:
    label: FRTB IMA capital for modellable risk (IMCC)
    description: >-
      Internal models approach capital for modellable risk factors (MAR33.15): 0.5 x the
      unconstrained liquidity-adjusted, stress-calibrated 97.5% ES plus 0.5 x the sum of the
      per-risk-class ES. Excludes NMRF (SES), the IMA default risk charge, the multiplier and the
      60-day average. A positive number is capital. Recomputed from each node's own vectors,
      never a sum of the nodes below: only looked up.
    unit: USD
    class: structured
    table: risk_metrics
    computed_at:
      - [firm_id]
      - [firm_id, business_line_id, desk_id]
  frtb_imcc_unconstrained:
    label: FRTB IMCC(C), unconstrained
    description: >-
      Liquidity-adjusted, stress-calibrated 97.5% ES of all risk classes together, with
      correlations across risk classes as observed (MAR33.13, MAR33.15). Only looked up.
    unit: USD
    class: structured
    table: risk_metrics
    computed_at:
      - [firm_id]
      - [firm_id, business_line_id, desk_id]
  frtb_imcc_constrained_sum:
    label: FRTB sum of IMCC(C_i), constrained
    description: >-
      Sum over risk classes of each risk class's liquidity-adjusted, stress-calibrated 97.5% ES
      computed alone (MAR33.14): no diversification across risk classes. Only looked up.
    unit: USD
    class: structured
    table: risk_metrics
    computed_at:
      - [firm_id]
      - [firm_id, business_line_id, desk_id]

  ccar_start_cet1_ratio:
    label: CCAR starting CET1 ratio
    description: >-
      Common equity tier 1 capital over risk-weighted assets at the start of the CCAR planning
      horizon (quarter 0), as a decimal. Scenario is *. A capital ratio: computed for legal
      entities and the firm only; capital is not allocated to business lines, desks or books.
    unit: ratio
    class: structured
    table: risk_metrics
    computed_at:
      - [firm_id]
      - [firm_id, legal_entity]
    not_allocated_to: [business_line_id, desk_id, book_id]
  ccar_min_cet1_ratio:
    label: CCAR minimum CET1 ratio
    description: >-
      Lowest projected CET1 ratio over the nine projected quarters of a CCAR scenario (scenario
      column: BASELINE or SEVERELY_ADVERSE), as a decimal. The firm's ratio is the firm's CET1
      over the firm's RWA, not a sum or average of entity ratios. Legal entities and firm only.
    unit: ratio
    class: structured
    carries_scenario: true
    table: risk_metrics
    computed_at:
      - [firm_id]
      - [firm_id, legal_entity]
    not_allocated_to: [business_line_id, desk_id, book_id]
  ccar_scb:
    label: Stress capital buffer (stylised)
    description: >-
      max(2.5%, starting CET1 ratio - minimum ratio under SEVERELY_ADVERSE + planned common
      dividends of the add-on quarters / RWA in the trough quarter), as a decimal (12 CFR
      225.8(f)(2)). Scenario is *. Legal entities and firm only; never summed.
    unit: ratio
    class: structured
    table: risk_metrics
    computed_at:
      - [firm_id]
      - [firm_id, legal_entity]
    not_allocated_to: [business_line_id, desk_id, book_id]

tables:
  risk_metrics:
    description: >-
      One row per aggregation, measure and node of the official run. node_level names the node's
      grouping set (dimensions joined by |); a dimension the node does not group by holds *.
      Every measure here is looked up, never summed across rows.
    # Rows a vector specification with diversification: true stores beside its measure,
    # between consecutive org levels of the specification (src/riskagg/measures/var.py).
    derived_rows:
      sum_children: >-
        At a parent node: the sum of the standalone values of its children at the next org
        level of the specification. The one deliberate sum of vector-measure values, shown
        beside the parent's own value; never a substitute for it.
      diversification: >-
        At a parent node: `<measure>__sum_children` minus the parent's own value, the diversification
        benefit. Never negative for ES (subadditive); it can be negative for VaR.
      incremental: >-
        At a child node: the parent's value minus the value of the parent's vector without
        this child, with the same function, level, window and horizon. Negative for a hedge;
        not the child's standalone value, and the children's incrementals do not add up to
        the parent.
    columns:
      as_of_date: {type: DATE, role: time}
      run_id: {type: STRING, role: dimension}
      spec_hash: {type: STRING, role: dimension}
      aggregation: {type: STRING, role: dimension}
      measure: {type: STRING, role: dimension}
      node_level: {type: STRING, role: dimension}
      firm_id: {type: STRING, role: dimension}
      business_line_id: {type: STRING, role: dimension}
      desk_id: {type: STRING, role: dimension}
      book_id: {type: STRING, role: dimension}
      legal_entity: {type: STRING, role: dimension}
      region: {type: STRING, role: dimension}
      asset_class: {type: STRING, role: dimension}
      currency: {type: STRING, role: dimension}
      risk_class: {type: STRING, role: dimension}
      scenario: {type: STRING, role: dimension}
      value: {type: DOUBLE, role: metric}
  pnl_scenarios:
    description: >-
      P&L per scenario (scenario_idx) and window at the reporting grain: the source of every VaR
      and ES query. Additive across rows of one window and one scenario_idx only; a VaR or ES is
      a quantile of a group's per-scenario sums.
    columns:
      as_of_date: {type: DATE, role: time}
      run_id: {type: STRING, role: dimension}
      spec_hash: {type: STRING, role: dimension}
      firm_id: {type: STRING, role: dimension}
      business_line_id: {type: STRING, role: dimension}
      desk_id: {type: STRING, role: dimension}
      book_id: {type: STRING, role: dimension}
      legal_entity: {type: STRING, role: dimension}
      region: {type: STRING, role: dimension}
      asset_class: {type: STRING, role: dimension}
      currency: {type: STRING, role: dimension}
      risk_class: {type: STRING, role: dimension}
      window: {type: STRING, role: dimension}
      scenario_idx: {type: INT, role: dimension}
      pnl: {type: DOUBLE, role: metric}
  stress_results:
    description: >-
      Stress P&L per scenario at the reporting grain (gains positive). Additive across rows of
      one scenario; never summed across scenarios.
    columns:
      as_of_date: {type: DATE, role: time}
      run_id: {type: STRING, role: dimension}
      spec_hash: {type: STRING, role: dimension}
      firm_id: {type: STRING, role: dimension}
      business_line_id: {type: STRING, role: dimension}
      desk_id: {type: STRING, role: dimension}
      book_id: {type: STRING, role: dimension}
      legal_entity: {type: STRING, role: dimension}
      region: {type: STRING, role: dimension}
      asset_class: {type: STRING, role: dimension}
      currency: {type: STRING, role: dimension}
      risk_class: {type: STRING, role: dimension}
      scenario: {type: STRING, role: dimension}
      pnl: {type: DOUBLE, role: metric}
  frtb_sa_detail:
    description: >-
      FRTB SA bucket detail per node, risk class, component (DELTA, VEGA, CURVATURE), bucket and
      correlation scenario: k_b is the bucket charge, s_b the bucket's signed sum of weighted
      sensitivities. Neither may be summed over buckets, nodes or scenarios.
    # Not additive: k_b is a bucket charge (a square root) and s_b a signed bucket sum; neither
    # may be summed over buckets, nodes or scenarios. No measure is served from this table, so
    # no Pinot star-tree is built for it. Read it with the drill-down.
    columns:
      as_of_date: {type: DATE, role: time}
      run_id: {type: STRING, role: dimension}
      spec_hash: {type: STRING, role: dimension}
      node_level: {type: STRING, role: dimension}
      firm_id: {type: STRING, role: dimension}
      business_line_id: {type: STRING, role: dimension}
      desk_id: {type: STRING, role: dimension}
      risk_class: {type: STRING, role: dimension}
      component: {type: STRING, role: dimension}
      bucket: {type: STRING, role: dimension}
      corr_scenario: {type: STRING, role: dimension}
      k_b: {type: DOUBLE, role: metric}
      s_b: {type: DOUBLE, role: metric}
  frtb_ima_detail:
    description: >-
      FRTB IMA expected shortfalls per node and risk-class scope (risk_class * is all classes
      together), each liquidity-horizon adjusted: es_fc for the full set of risk factors on the
      current window, es_rc for the reduced set on the current window, es_rs for the reduced set
      on the stressed window, and es = es_rs x max(es_fc / es_rc, 1). None may be summed over
      nodes or risk classes.
    # Not additive: every column is an expected shortfall (or a stress-scaled one) of a node and
    # risk-class scope (risk_class * = all classes together); none may be summed over nodes or
    # risk classes. No measure is served from this table, so no Pinot star-tree is built.
    columns:
      as_of_date: {type: DATE, role: time}
      run_id: {type: STRING, role: dimension}
      spec_hash: {type: STRING, role: dimension}
      node_level: {type: STRING, role: dimension}
      firm_id: {type: STRING, role: dimension}
      business_line_id: {type: STRING, role: dimension}
      desk_id: {type: STRING, role: dimension}
      risk_class: {type: STRING, role: dimension}
      es_fc: {type: DOUBLE, role: metric}
      es_rc: {type: DOUBLE, role: metric}
      es_rs: {type: DOUBLE, role: metric}
      es: {type: DOUBLE, role: metric}
  ccar_projection:
    description: >-
      The CCAR path: one row per scenario, projected quarter (1 to 9) and node (node_level
      BUSINESS_LINE, LEGAL_ENTITY or FIRM). Loss and revenue columns add across nodes of one
      level within a scenario and quarter; cet1, rwa and cet1_ratio are null for business lines
      and are levels on a path, never summed over quarters or levels.
    # The CCAR path: one row per scenario, projected quarter (1..9) and node. node_level is
    # BUSINESS_LINE, LEGAL_ENTITY or FIRM; never sum across levels (each level already holds the
    # whole firm). Loss and revenue columns are additive across nodes of one level within a
    # scenario and quarter; cet1, rwa and cet1_ratio are null for business lines, and cet1 and
    # cet1_ratio are levels on a path, not flows (never summed over quarters). No measure is
    # served from this table, so no Pinot star-tree is built. Read it with the drill-down.
    # nullable: the column is null on business-line rows (capital is not allocated to them);
    # Pinot keeps those nulls (column-based null handling) instead of storing 0.
    columns:
      as_of_date: {type: DATE, role: time}
      run_id: {type: STRING, role: dimension}
      spec_hash: {type: STRING, role: dimension}
      scenario: {type: STRING, role: dimension}
      quarter: {type: INT, role: dimension}
      node_level: {type: STRING, role: dimension}
      node_id: {type: STRING, role: dimension}
      ppnr: {type: DOUBLE, role: metric}
      credit_loss: {type: DOUBLE, role: metric}
      trading_loss: {type: DOUBLE, role: metric}
      net_income: {type: DOUBLE, role: metric}
      dividends: {type: DOUBLE, role: metric, nullable: true}
      cet1: {type: DOUBLE, role: metric, nullable: true}
      rwa: {type: DOUBLE, role: metric, nullable: true}
      cet1_ratio: {type: DOUBLE, role: metric, nullable: true}
